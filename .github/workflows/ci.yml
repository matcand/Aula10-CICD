name: Java CI Pipeline

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -Dmaven.compiler.source=17 -Dmaven.compiler.target=17

      - name: Run Unit Tests
        run: mvn test -Dmaven.compiler.source=17 -Dmaven.compiler.target=17

      - name: Code Quality Check
        run: mvn checkstyle:check -Dmaven.compiler.source=17 -Dmaven.compiler.target=17
        continue-on-error: false

      - name: Generate JaCoCo Coverage Report
        run: mvn jacoco:report -Dmaven.compiler.source=17 -Dmaven.compiler.target=17